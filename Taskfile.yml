version: '3'
vars:
  PRESET: '{{default "dev" .PRESET}}'
tasks:
  build:
    desc: Configure and build with the selected CMake preset (default dev)
    cmds:
      - cmake --preset {{.PRESET}}
      - cmake --build --preset {{.PRESET}}
  run:
    desc: Build and launch HoloNight Screenshot (pass app arguments after --)
    cmds:
      - task: build
      - '"build/{{.PRESET}}/apps/screenshot/holonight-screenshot" {{.CLI_ARGS}}'
  test:
    desc: Build the dev preset and run CTest (pass CTest arguments after --)
    cmds:
      - task: build
        vars:
          PRESET: dev
      - ctest --preset dev {{.CLI_ARGS}}
  format:
    desc: Format owned C and C++ files
    cmds:
      - python3 scripts/quality.py format
  format-check:
    desc: Check C and C++ formatting without editing files
    cmds:
      - python3 scripts/quality.py format-check
  tidy:
    desc: Build and run Clang static analysis for the selected preset
    cmds:
      - task: build
      - task: tidy:analyze
  tidy:analyze:
    internal: true
    cmds:
      - python3 scripts/quality.py tidy --build "build/{{.PRESET}}"
  qml-lint:
    desc: Lint the launcher and region overlay with the selected Qt SDK
    cmds:
      - cmake --preset "{{.PRESET}}"
      - cmake --build --preset "{{.PRESET}}" --target qml-lint
  license-check:
    desc: Validate REUSE licensing metadata
    cmds:
      - reuse --no-multiprocessing lint
  check:
    desc: Run the native quality gate and development tests
    vars:
      PRESET: dev
    cmds:
      - task: format-check
      - task: license-check
      - task: build
        vars: {PRESET: dev}
      - task: tidy:analyze
        vars: {PRESET: dev}
      - cmake --build --preset dev --target qml-lint
      - ctest --preset dev
